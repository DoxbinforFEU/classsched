<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS IT · Year 2, Sec 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A4A;
    --paper:#F7F4EC;
    --paper-2:#EFEADC;
    --muted:#7A7566;
    --line:rgba(27,42,74,0.14);

    --mon:#E1663F;
    --tue:#1F8A83;
    --wed:#C9962C;
    --thu:#6B5B95;
    --fri:#B23A6B;

    --lab-tag:#1B2A4A;
    --lec-tag:#B0532C;
    --combo-tag:#3E7A46;

    --dsa:#1F8A83;
    --elec:#6B5B95;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--tue); color:var(--paper); }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px 80px; }

  header.hero{
    padding:56px 28px 40px;
    position:relative;
    overflow:hidden;
    border-bottom:2px solid var(--ink);
  }
  header.hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, transparent, transparent 118px, var(--line) 118px, var(--line) 119px);
    pointer-events:none;
  }
  .hero-inner{ max-width:1180px; margin:0 auto; position:relative; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    display:flex; gap:10px; align-items:center;
    margin-bottom:18px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--tue); }

  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(40px, 6vw, 74px);
    line-height:0.98;
    letter-spacing:-0.01em;
  }
  h1.title em{
    font-style:italic;
    font-weight:400;
    color:var(--tue);
  }

  .hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:36px;
    margin-top:34px;
    padding-top:26px;
    border-top:1px solid var(--line);
  }
  .meta-item .num{
    font-family:'Fraunces', serif;
    font-size:34px;
    font-weight:600;
  }
  .meta-item .lbl{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:2px;
  }

  .flag-note{
    margin-top:26px;
    padding:12px 16px;
    background:rgba(225,102,63,0.12);
    border:1px solid rgba(225,102,63,0.35);
    border-radius:3px;
    font-size:12.5px;
    color:var(--ink);
    max-width:560px;
  }
  .flag-note b{ color:var(--mon); }

  nav.days{
    display:flex;
    gap:0;
    margin:44px 0 30px;
    border:1.5px solid var(--ink);
    overflow:hidden;
    border-radius:3px;
  }
  nav.days button{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.06em;
    padding:14px 8px;
    background:transparent;
    border:none;
    border-right:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
    text-transform:uppercase;
    transition:background .18s ease, color .18s ease;
    position:relative;
  }
  nav.days button:last-child{ border-right:none; }
  nav.days button .count{
    display:block;
    font-family:'Fraunces', serif;
    font-size:20px;
    margin-top:2px;
  }
  nav.days button.active{
    background:var(--ink);
    color:var(--paper);
  }
  nav.days button[data-day="ALL"].active{ background:var(--tue); }

  nav.pages{
    display:flex;
    gap:0;
    margin-top:34px;
    border:1.5px solid var(--ink);
    overflow:hidden;
    border-radius:3px;
    max-width:420px;
  }
  nav.pages button{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.08em;
    padding:12px 8px;
    background:transparent;
    border:none;
    border-right:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
    text-transform:uppercase;
    transition:background .18s ease, color .18s ease;
  }
  nav.pages button:last-child{ border-right:none; }
  nav.pages button.active{ background:var(--ink); color:var(--paper); }

  nav.subjects{
    display:flex;
    gap:0;
    margin:0 0 30px;
    border:1.5px solid var(--ink);
    overflow:hidden;
    border-radius:3px;
  }
  nav.subjects button{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.06em;
    padding:14px 8px;
    background:transparent;
    border:none;
    border-right:1.5px solid var(--ink);
    color:var(--ink);
    cursor:pointer;
    text-transform:uppercase;
    transition:background .18s ease, color .18s ease;
  }
  nav.subjects button:last-child{ border-right:none; }
  nav.subjects button .count{
    display:block;
    font-family:'Fraunces', serif;
    font-size:20px;
    margin-top:2px;
  }
  nav.subjects button.active{ background:var(--ink); color:var(--paper); }
  nav.subjects button[data-subj="ALL"].active{ background:var(--tue); }
  nav.subjects button[data-subj="DSA"].active{ background:var(--dsa); }
  nav.subjects button[data-subj="ELEC"].active{ background:var(--elec); }

  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin:40px 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .section-head:first-of-type{ margin-top:0; }
  .section-head h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
  }
  .section-head .subj-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:0.04em;
  }

  .group-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-left:5px solid var(--ink);
    border-radius:2px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .group-card.subj-DSA{ border-left-color:var(--dsa); }
  .group-card.subj-ELEC{ border-left-color:var(--elec); }

  .group-card .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .group-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    line-height:1.15;
  }
  .group-topic{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .size-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--paper);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .group-card.subj-DSA .size-tag{ background:var(--dsa); }
  .group-card.subj-ELEC .size-tag{ background:var(--elec); }

  .members{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .member{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
  }
  .member .avatar{
    width:26px; height:26px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    color:var(--paper);
  }
  .group-card.subj-DSA .member .avatar{ background:var(--dsa); }
  .group-card.subj-ELEC .member .avatar{ background:var(--elec); }
  .member .name{ color:var(--ink); }
  .member .name.both{ font-weight:600; }
  .member .flag{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    color:var(--mon);
    border:1px solid rgba(225,102,63,0.4);
    background:rgba(225,102,63,0.1);
    padding:1px 5px;
    border-radius:20px;
    margin-left:auto;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:16px;
  }

  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-left:5px solid var(--ink);
    border-radius:2px;
    padding:20px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card.day-MON{ border-left-color:var(--mon); }
  .card.day-TUE{ border-left-color:var(--tue); }
  .card.day-WED{ border-left-color:var(--wed); }
  .card.day-THU{ border-left-color:var(--thu); }
  .card.day-FRI{ border-left-color:var(--fri); }

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .code{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    color:var(--muted);
  }
  .units{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    background:var(--ink);
    color:var(--paper);
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .course-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    line-height:1.15;
  }

  .sessions{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:2px;
  }
  .session{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:13.5px;
    flex-wrap:wrap;
  }
  .session .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:600;
    padding:2px 6px;
    border-radius:3px;
    letter-spacing:0.04em;
  }
  .session .tag.LEC{ background:rgba(176,83,44,0.14); color:var(--lec-tag); }
  .session .tag.LAB{ background:rgba(27,42,74,0.1); color:var(--lab-tag); }
  .session .tag.COMBO{ background:rgba(62,122,70,0.14); color:var(--combo-tag); }
  .session .day-label{ font-weight:600; width:34px; flex-shrink:0; }
  .session .time{ font-family:'IBM Plex Mono', monospace; color:var(--ink); }
  .session .room{ color:var(--muted); font-size:12.5px; margin-left:auto; }
  .session .room.tba{ color:var(--mon); font-weight:600; }

  .card-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:auto;
    padding-top:12px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
  }
  .prof{ color:var(--ink); font-weight:500; }
  .netsuite{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--muted);
    cursor:pointer;
    border-bottom:1px dotted var(--muted);
  }

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }

  .totals{
    margin-top:56px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    padding:22px 26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    background:var(--ink);
    color:var(--paper);
  }
  .totals .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:rgba(247,244,236,0.6);
  }
  .totals .value{
    font-family:'Fraunces', serif;
    font-size:28px;
    font-weight:600;
  }
  .totals .bars{ display:flex; gap:4px; }
  .totals .bar{ width:8px; height:22px; background:var(--tue); border-radius:1px; }

  footer.sig{
    text-align:center;
    margin-top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
  }

  @media (max-width:640px){
    nav.days{ flex-wrap:wrap; }
    nav.days button{ flex:1 1 30%; border-bottom:1.5px solid var(--ink); }
    .session .room{ margin-left:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow"><span class="dot"></span> BS INFORMATION TECHNOLOGY · A.Y. 2025</div>
    <h1 class="title">Year 2, <em>Section 3</em></h1>
    <p style="margin-top:14px; color:var(--muted); font-size:15px; max-width:520px;">
      Face to face / onsite schedule.
    </p>
    <div class="hero-meta">
      <div class="meta-item"><div class="num">8</div><div class="lbl">Courses</div></div>
      <div class="meta-item"><div class="num">23</div><div class="lbl">Total units</div></div>
      <div class="meta-item"><div class="num">5</div><div class="lbl">Days on campus</div></div>
      <div class="meta-item"><div class="num">7</div><div class="lbl">Faculty</div></div>
    </div>
    <nav class="pages" id="pageNav">
      <button data-page="schedule" class="active">Schedule</button>
      <button data-page="groups">Groups</button>
    </nav>
  </div>
</header>

<div class="wrap">
<div id="page-schedule">
  <nav class="days" id="dayNav">
    <button data-day="ALL" class="active">ALL<span class="count" id="c-ALL"></span></button>
    <button data-day="MON">MON<span class="count" id="c-MON"></span></button>
    <button data-day="TUE">TUE<span class="count" id="c-TUE"></span></button>
    <button data-day="WED">WED<span class="count" id="c-WED"></span></button>
    <button data-day="THU">THU<span class="count" id="c-THU"></span></button>
    <button data-day="FRI">FRI<span class="count" id="c-FRI"></span></button>
  </nav>

  <div class="grid" id="grid"></div>

  <div class="totals">
    <div>
      <div class="label">Total units this term</div>
      <div class="value">23 units</div>
    </div>
    <div class="bars" id="unitBars"></div>
  </div>

  <footer class="sig">NetSuite sections listed on each card · tap to copy</footer>
</div>

<div id="page-groups" style="display:none">
  <nav class="subjects" id="subjNav">
    <button data-subj="ALL" class="active">ALL<span class="count" id="c-ALL"></span></button>
    <button data-subj="DSA">DSA<span class="count" id="c-DSA"></span></button>
    <button data-subj="ELEC">ELECTIVE 1<span class="count" id="c-ELEC"></span></button>
  </nav>

  <div id="groupsContent"></div>

  <footer class="sig">IT251 · Final Project Groups · ITE211 · Topic Groupings</footer>
</div>

</div>

<script>
const courses = [
  {
    code:"IT2112",
    name:"Networking 1",
    units:3,
    prof:"Jay Concepcion",
    netsuite:"",
    sessions:[
      {day:"TUE", type:"COMBO", time:"11:00 AM – 1:30 PM", room:"TBA", tba:true},
      {day:"FRI", type:"COMBO", time:"11:00 AM – 1:30 PM", room:"Room 604"}
    ]
  },

  {
    code:"IT282",
    name:"Fundamentals of Database Management System",
    units:3,
    prof:"Jerick M. Quintua",
    netsuite:"IT282-LAB-Sec3-MR / IT282-LEC-Sec3-MR",
    sessions:[
      {day:"MON", type:"COMBO", time:"11:00 AM – 1:30 PM", room:"Room 309"},
      {day:"THU", type:"COMBO", time:"11:00 AM – 1:30 PM", room:"Room 403"}
    ]
  },
  {
    code:"PATHFIT231",
    name:"Dance, Sports, Martial Arts, Group Exercises & Outdoor Activities",
    units:2,
    prof:"Miguel Cedrickh Ona",
    netsuite:"PATHFIT231-LEC-Sec3-MR",
    sessions:[
      {day:"MON", type:"LEC", time:"2:00 PM – 4:00 PM", room:"Dance Room"}
    ]
  },
  {
    code:"GE111",
    name:"Understanding the Self",
    units:3,
    prof:"Mary Ann Cahanap",
    netsuite:"GE111-LEC-Sec6-MR",
    sessions:[
      {day:"TUE", type:"LEC", time:"1:30 PM – 3:00 PM", room:"Room 607"},
      {day:"FRI", type:"LEC", time:"1:30 PM – 3:00 PM", room:"Room 607"}
    ]
  },
  {
    code:"GE261",
    name:"Science, Technology and Society",
    units:3,
    prof:"Orlando Santos",
    netsuite:"GE261-LEC-Sec6-MR",
    sessions:[
      {day:"TUE", type:"LEC", time:"9:00 AM – 10:30 AM", room:"Room 608"},
      {day:"FRI", type:"LEC", time:"9:00 AM – 10:30 AM", room:"Room 608"}
    ]
  },
  {
    code:"IT251",
    name:"Data Structures and Algorithms",
    units:3,
    prof:"John Joshua Sazon",
    netsuite:"IT251-LEC-Sec3-MR / IT251-LAB-Sec3-MR",
    sessions:[
      {day:"TUE", type:"LAB", time:"3:00 PM – 5:30 PM", room:"Room 403"},
      {day:"FRI", type:"LEC", time:"3:00 PM – 5:30 PM", room:"Room 605"}
    ]
  },
  {
    code:"ITE211",
    name:"Elective 1",
    units:3,
    prof:"Rodel Villarez",
    netsuite:"ITE211-LAB-Sec3-MR / ITE211-LEC-Sec3-MR",
    sessions:[
      {day:"WED", type:"COMBO", time:"1:30 PM – 6:00 PM", room:"MACLAB 401"}
    ]
  },
  {
    code:"IT271",
    name:"Human Computer Interaction",
    units:3,
    prof:"Ronn Kevin Javier",
    netsuite:"IT271-LEC-Sec3-MR / IT271-LAB-Sec3-MR",
    sessions:[
      {day:"WED", type:"LEC", time:"7:30 AM – 10:00 AM", room:"Room 607"},
      {day:"THU", type:"LAB", time:"1:30 PM – 4:00 PM", room:"208 Old Bldg"}
    ]
  }
];

const grid = document.getElementById('grid');
const dayOrder = ["MON","TUE","WED","THU","FRI"];

function dayCounts(){
  const counts = {MON:0,TUE:0,WED:0,THU:0,FRI:0};
  courses.forEach(c => {
    const days = new Set(c.sessions.map(s => s.day));
    days.forEach(d => counts[d]++);
  });
  return counts;
}
const counts = dayCounts();
dayOrder.forEach(d => document.getElementById('c-'+d).textContent = counts[d]);
document.getElementById('c-ALL').textContent = courses.length;

function render(filter){
  grid.innerHTML = "";
  const visible = courses.filter(c => filter === "ALL" || c.sessions.some(s => s.day === filter));

  if(visible.length === 0){
    grid.innerHTML = '<div class="empty-state">No classes scheduled.</div>';
    return;
  }

  visible.forEach(c => {
    const primaryDay = filter !== "ALL" ? filter : c.sessions[0].day;
    const card = document.createElement('div');
    card.className = `card day-${primaryDay}`;

    const sessionsHTML = c.sessions
      .filter(s => filter === "ALL" || s.day === filter)
      .map(s => `
        <div class="session">
          <span class="day-label">${s.day}</span>
          <span class="tag ${s.type}">${s.type === 'COMBO' ? 'LEC+LAB' : s.type}</span>
          <span class="time">${s.time}</span>
          <span class="room${s.tba ? ' tba' : ''}">${s.room}</span>
        </div>
      `).join("");

    card.innerHTML = `
      <div class="card-top">
        <span class="code">${c.code}</span>
        <span class="units">${c.units} unit${c.units > 1 ? 's' : ''}</span>
      </div>
      <div class="course-name">${c.name}</div>
      <div class="sessions">${sessionsHTML}</div>
      <div class="card-foot">
        <span class="prof">${c.prof}</span>
      </div>
    `;

    grid.appendChild(card);
  });
}

document.getElementById('dayNav').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#dayNav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render(btn.dataset.day);
});

const barsWrap = document.getElementById('unitBars');
for(let i=0;i<23;i++){
  const b = document.createElement('div');
  b.className = 'bar';
  barsWrap.appendChild(b);
}

render("ALL");

/* ---------------- Groups page ---------------- */

const dsaGroups = [
  { label:"Group 1", members:["Elcid Justine Taroma","Kenneth Andrei Fernandez","Kurt Racel Jacob","Pauleen Claire Rivera"] },
  { label:"Group 2", members:["Angel Ronquillo","John Michael Sze","Josef Renzie Tandoc","Marcus Curt Dadivas"] },
  { label:"Group 3", members:["Brent Joshua Ray Abriam","Lance Emmanuel Diego","Shawn Ervhin Manaog"] },
  { label:"Group 4", members:["Aya Janel Jimenez","Jefflyn Faith Lamila","Jian Bert Quibete","Maria Juliza Padpad"] },
  { label:"Group 5", members:["Aneeza Amor Castro","Janah Alaika Olivar","Rhian Kyrish Maurie Metrio"] },
  { label:"Group 6", members:["Johann Paul Leano","Johnromeo Estrellado","Joseph Peralta"] },
  { label:"Group 7", members:["Franz Amiel Colico","Jhun Clarence Carcueva","Malla Denise Rivera","Raiza Ann Marie Donesa"] },
  { label:"Group 8", members:["Dirk Martin Sotto","John Patrick De Luna","Kyro Anton Carino","Mikhail Pabular"] }
];

function normalizeName(name){
  return name.toLowerCase()
    .replace(/[.,]/g,"")
    .replace(/ñ/g,"n")
    .split(/\s+/)
    .filter(Boolean)
    .sort()
    .join(" ");
}

const dsaNames = new Set();
dsaGroups.forEach(g => g.members.forEach(m => dsaNames.add(normalizeName(m))));
const elecNames = new Set();
elecGroups.forEach(g => g.members.forEach(m => elecNames.add(normalizeName(m))));

function initials(name){
  const parts = name.replace(/[.,]/g,"").split(/\s+/).filter(Boolean);
  const first = parts[0]?.[0] || "";
  const last = parts[parts.length-1]?.[0] || "";
  return (first+last).toUpperCase();
}

function memberHTML(name, subj){
  const norm = normalizeName(name);
  const inBoth = subj === "DSA" ? elecNames.has(norm) : dsaNames.has(norm);
  return `
    <div class="member">
      <span class="avatar">${initials(name)}</span>
      <span class="name${inBoth ? ' both' : ''}">${name}</span>
      ${inBoth ? '<span class="flag">also in ' + (subj === "DSA" ? "Elective 1" : "DSA") + '</span>' : ''}
    </div>
  `;
}

function groupCardHTML(group, subj, sectionLabel){
  return `
    <div class="group-card subj-${subj}">
      <div class="card-top">
        <div>
          <div class="group-name">${group.label}</div>
          <div class="group-topic">${sectionLabel}</div>
        </div>
        <span class="size-tag">${group.members.length} student${group.members.length > 1 ? 's' : ''}</span>
      </div>
      <div class="members">
        ${group.members.map(m => memberHTML(m, subj)).join("")}
      </div>
    </div>
  `;
}

function groupSectionHTML(title, sub, groups, subj){
  return `
    <div class="section-head">
      <h2>${title}</h2>
      <span class="subj-sub">${sub}</span>
    </div>
    <div class="grid">
      ${groups.map(g => groupCardHTML(g, subj, sub)).join("")}
    </div>
  `;
}

const groupsContent = document.getElementById('groupsContent');

function renderGroups(filter){
  let html = "";
  if(filter === "ALL" || filter === "DSA"){
    html += groupSectionHTML("Data Structures and Algorithms", "IT251 · Final Project Groups", dsaGroups, "DSA");
  }
  if(filter === "ALL" || filter === "ELEC"){
    html += groupSectionHTML("Elective 1", "ITE211 · Topic Groupings", elecGroups, "ELEC");
  }
  groupsContent.innerHTML = html || '<div class="empty-state">No groups to show.</div>';
}

document.getElementById('c-DSA').textContent = dsaGroups.length;
document.getElementById('c-ELEC').textContent = elecGroups.length;

document.getElementById('subjNav').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#subjNav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGroups(btn.dataset.subj);
});
